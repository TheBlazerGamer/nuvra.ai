networks:
  network_swarm_public:
    external: true
  # Rede só do Nuvra.AI, sem saída para a internet nem para o Postgres de relatórios/tracking existente.
  nuvra_internal:
    driver: overlay

volumes:
  nuvra_pgdata:

services:
  # Banco PRÓPRIO do Nuvra.AI — não é o Postgres de relatórios/tracking que já existe no servidor.
  # Sem porta publicada e fora da rede pública: só o backend enxerga.
  # Os acessos usam o nome completo "nuvra_postgres" (e não só "postgres"): o backend também está na rede
  # pública, onde o Postgres de relatórios/tracking já existente pode responder pelo nome curto "postgres".
  postgres:
    image: postgres:17-bookworm
    networks: [nuvra_internal]
    environment:
      POSTGRES_USER: nuvra_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: nuvra
    volumes:
      - nuvra_pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1

  # Prepara o banco: aplica as migrations e liga o login dos papéis nuvra_app/nuvra_system.
  # Roda sozinho a cada deploy novo, termina e fica parado (no Portainer aparece 0/1: é o normal).
  # Se o Postgres ainda estiver ligando, tenta de novo sozinho (até 10 vezes).
  migrator:
    image: ghcr.io/theblazergamer/nuvra-backend:migrator-latest
    networks: [nuvra_internal]
    environment:
      DB_OWNER_URL: postgresql://nuvra_owner:${DB_OWNER_PASSWORD}@nuvra_postgres:5432/nuvra
      DB_APP_URL: postgresql://nuvra_app:${DB_APP_PASSWORD}@nuvra_postgres:5432/nuvra
      DB_SYSTEM_URL: postgresql://nuvra_system:${DB_SYSTEM_PASSWORD}@nuvra_postgres:5432/nuvra
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10

  backend:
    image: ghcr.io/theblazergamer/nuvra-backend:latest
    networks: [network_swarm_public, nuvra_internal]
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"
      WEB_ORIGIN: https://gestor.gruponuvra.com.br
      API_ORIGIN: https://api.gruponuvra.com.br
      # Sem DB_OWNER_URL de propósito: a API nunca usa o papel dono (só as migrations, em container à parte).
      DB_APP_URL: postgresql://nuvra_app:${DB_APP_PASSWORD}@nuvra_postgres:5432/nuvra
      DB_SYSTEM_URL: postgresql://nuvra_system:${DB_SYSTEM_PASSWORD}@nuvra_postgres:5432/nuvra
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY}
      EMAIL_TRANSPORT: smtp
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: smtp-relay.brevo.com
      # 2525 e não 587: a DigitalOcean bloqueia as portas 25/465/587 de saída; o Brevo também aceita 2525.
      SMTP_PORT: "2525"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.nuvra_api.entrypoints=websecure
        - traefik.http.routers.nuvra_api.rule=Host(`api.gruponuvra.com.br`)
        - traefik.http.routers.nuvra_api.tls.certresolver=letsencryptresolver
        - traefik.http.services.nuvra_api.loadbalancer.server.port=3001
        - traefik.http.services.nuvra_api.loadbalancer.passHostHeader=true

  frontend:
    image: ghcr.io/theblazergamer/nuvra-frontend:latest
    networks: [network_swarm_public]
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.routers.nuvra_gestor.entrypoints=websecure
        - traefik.http.routers.nuvra_gestor.rule=Host(`gestor.gruponuvra.com.br`)
        - traefik.http.routers.nuvra_gestor.tls.certresolver=letsencryptresolver
        - traefik.http.services.nuvra_gestor.loadbalancer.server.port=3000
        - traefik.http.services.nuvra_gestor.loadbalancer.passHostHeader=true
