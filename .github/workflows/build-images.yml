name: Build e publicar imagens

# Só constrói e publica as imagens no GitHub Container Registry (GHCR).
# Não faz deploy automático: a atualização do serviço no Portainer continua manual
# até a gente automatizar esse próximo passo com calma.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push (runtime)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nuvra-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nuvra-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push (migrator)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nuvra-backend:migrator-latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nuvra-backend:migrator-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.gruponuvra.com.br
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nuvra-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/nuvra-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
