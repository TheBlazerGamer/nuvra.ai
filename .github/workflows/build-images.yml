name: Build e publicar imagens

# Só constrói e publica as imagens no GitHub Container Registry (GHCR).
# Não faz deploy automático: a atualização do serviço no Portainer continua manual
# até a gente automatizar esse próximo passo com calma.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  # O Docker exige nome de imagem em minúsculas; github.repository_owner preserva a grafia do usuário
  # (ex.: "TheBlazerGamer"), então convertemos aqui uma vez e reaproveitamos nos dois jobs abaixo.
  config:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.lower }}
    steps:
      - id: owner
        run: echo "lower=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

  backend:
    needs: config
    runs-on: ubuntu-latest
    env:
      IMAGEM: ghcr.io/${{ needs.config.outputs.owner }}/nuvra-backend
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push (runtime)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push (migrator)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGEM }}:migrator-latest
            ${{ env.IMAGEM }}:migrator-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    needs: config
    runs-on: ubuntu-latest
    env:
      IMAGEM: ghcr.io/${{ needs.config.outputs.owner }}/nuvra-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.gruponuvra.com.br
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
